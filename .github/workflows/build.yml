name: Build Aurora Visuals

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: unzip AuroraVisuals-1.21.4-implemented.zip

      - name: Build JAR
        run: |
          cd AuroraVisuals-1.21.4
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Visuals-JAR
          path: AuroraVisuals-1.21.4/build/libs/*.jar
