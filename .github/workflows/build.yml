
name: Build Aurora Visuals

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Extract Liquid Glass project
        run: |
          unzip -o AuroraVisuals-1.21.4-liquid-glass.zip
          ls -la

      - name: Build JAR
        run: |
          cd AuroraVisuals-1.21.4
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Visuals-Liquid-Glass
          path: AuroraVisuals-1.21.4/build/libs/*.jar
